<!doctype html><html lang="es-CL"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu cartita — Cartita</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css"><style>
:root{--lacre:#8E2F2F}
body{background:var(--crema)}
.cierre{min-height:100dvh;display:grid;place-items:center;padding:30px 20px}
.cierre.oculto{display:none}
.sobre-caja{width:min(300px,80vw);position:relative;perspective:1000px;cursor:pointer}
.pieza{position:relative;aspect-ratio:3/2;background:var(--blanco);border:1.5px solid var(--tinta);border-radius:6px;box-shadow:0 18px 40px rgba(31,27,22,.16)}
.solapa{position:absolute;inset:0;background:var(--blanco);border:1.5px solid var(--tinta);border-radius:6px;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;z-index:3;transition:transform .9s}
.sello{position:absolute;left:50%;top:56%;width:44px;height:44px;margin-left:-22px;border-radius:50%;background:var(--lacre);color:#fff;font-family:var(--serif);display:grid;place-items:center;z-index:4}
.sobre-caja.abierto .solapa{transform:rotateX(-172deg)}
.texto-sobre{text-align:center;margin-bottom:22px}
.texto-sobre .k{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--oliva);font-weight:600}
.texto-sobre h1{font-family:var(--serif);font-size:1.8rem;margin:8px 0 0}
.carta{max-width:620px;margin:0 auto;padding:36px 20px 60px;display:none}
.carta.visible{display:block}
.carta h2{font-family:var(--serif);font-size:clamp(1.7rem,5vw,2.4rem);margin:0 0 6px}
.carta .para{color:var(--gris);margin:0 0 24px;font-size:.92rem}
.mensaje{font-family:var(--serif);font-size:1.1rem;line-height:1.75;margin:0 0 30px}
.mensaje p{margin:0 0 15px}
.fotos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:30px}
.fotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px}
.pie-carta{text-align:center;border-top:1px solid var(--linea);padding-top:24px}
.pie-carta a{color:var(--lacre);font-weight:600;text-decoration:none}
.pie-carta span{display:block;font-size:.74rem;color:var(--gris);margin-top:8px}
.barra-pub{position:fixed;left:0;right:0;bottom:0;background:var(--tinta);color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;font-size:.8rem;z-index:50}
.barra-pub input{flex:1;padding:9px;border-radius:6px;border:0;font-size:.78rem;font-family:var(--sans);min-width:0}
.barra-pub button{border:0;border-radius:6px;padding:9px 12px;background:var(--lacre);color:#fff;font-weight:600;cursor:pointer;font-family:var(--sans)}
</style></head><body>
<section class="cierre" id="pantalla">
  <div>
    <div class="texto-sobre"><p class="k">Recibiste una carta</p><h1 id="de">de alguien</h1><p id="para"></p></div>
    <div class="sobre-caja" id="sobre" role="button" tabindex="0"><div class="pieza"><div class="solapa"></div><div class="sello">J</div></div></div>
    <button class="btn btn-p" style="display:block;margin:24px auto 0" id="abrir">Abrir</button>
  </div>
</section>
<main class="carta" id="carta">
  <p class="para" id="fecha"></p>
  <h2 id="titulo"></h2>
  <div class="mensaje" id="mensaje"></div>
  <div class="fotos" id="fotos"></div>
  <p class="pie-carta"><a href="cumpleanos.html">Haz tu propia cartita →</a><span>Hecho en Cartita</span></p>
</main>
<div class="barra-pub" id="barra" style="display:none">
  <input id="link" readonly>
  <button id="copiar">Copiar link</button>
</div>
<script>
const d=JSON.parse(localStorage.getItem('cartita_pagado')||'null');
if(!d){location.href='crear.html';}
else{
  document.getElementById('de').textContent='de '+(d.de||'alguien');
  if(d.para)document.getElementById('para').textContent='Para '+d.para;
  document.querySelector('.sello').textContent=(d.de||'C').charAt(0);
  document.getElementById('fecha').textContent=d.fecha||'';
  document.getElementById('titulo').textContent=(d.mensaje||'').split('\n')[0]||'Tu carta';
  document.getElementById('mensaje').innerHTML=(d.mensaje||'').split('\n').slice(1).map(l=>'<p>'+l+'</p>').join('');
  document.getElementById('fotos').innerHTML=(d.fotos||[]).map(f=>'<img src="'+f+'" alt="">').join('');
  const slug=(d.codigo||'AMR').replace(/[^A-Z0-9]/g,'').toLowerCase();
  const url=location.origin+location.pathname.replace('carta.html','carta.html?c='+slug);
  document.getElementById('link').value=url;
  document.getElementById('barra').style.display='flex';
  document.getElementById('copiar').addEventListener('click',()=>{navigator.clipboard.writeText(url);document.getElementById('copiar').textContent='Copiado';});
}
function abrir(){document.getElementById('sobre').classList.add('abierto');setTimeout(()=>{document.getElementById('pantalla').classList.add('oculto');document.getElementById('carta').classList.add('visible');},700);}
document.getElementById('abrir').addEventListener('click',abrir);
document.getElementById('sobre').addEventListener('click',abrir);
</script>
</body></html>
