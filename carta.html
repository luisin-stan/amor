<!-- ARCHIVO: carta.html — carta publicada -->
<!doctype html><html lang="es-CL"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recibiste una carta — Cartita</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css"><style>
body{background:var(--crema);margin:0}
.cierre{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px 20px 50px;position:relative}
.cierre.oculto{display:none}
.texto{text-align:center;margin-bottom:24px}
.texto .k{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--oliva);font-weight:600;margin:0}
.texto h1{font-family:var(--serif);font-size:1.75rem;margin:9px 0 0;line-height:1.2}
.texto p{margin:6px 0 0;color:var(--gris);font-size:.92rem}
.escena{width:240px;height:160px;position:relative;perspective:900px;cursor:pointer;flex:0 0 auto}
.pieza{position:absolute;inset:0;background:var(--blanco);border:1.5px solid var(--tinta);border-radius:6px;box-shadow:0 16px 34px rgba(31,27,22,.15)}
.solapa{position:absolute;inset:0;background:var(--blanco);border:1.5px solid var(--tinta);border-radius:6px;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;z-index:3;transition:transform .9s cubic-bezier(.6,0,.3,1);pointer-events:none}
.sello{position:absolute;left:50%;top:56%;width:42px;height:42px;margin-left:-21px;border-radius:50%;background:var(--lacre);color:#fff;font-family:var(--serif);display:grid;place-items:center;z-index:4;pointer-events:none;transition:.35s}
.candado{position:absolute;left:50%;top:56%;margin-left:-15px;width:30px;height:30px;border-radius:8px;background:var(--tinta);color:#fff;display:none;place-items:center;z-index:5;pointer-events:none}
.clave .candado{display:grid}
.escena.abierto .solapa{transform:rotateX(-172deg)}
.escena.abierto .sello,.escena.abierto .candado{opacity:0}
.abrirBtn{display:block;margin:26px auto 0;padding:14px 42px;border-radius:100px;border:0;background:var(--lacre);color:#fff;font-weight:600;font-size:1rem;cursor:pointer;font-family:var(--sans)}
.clave .abrirBtn,.programada .abrirBtn{display:none}
.panel{display:none;width:100%;max-width:300px;margin:26px auto 0;text-align:center}
.clave .panel{display:block}
.pista{border:1px solid var(--linea);background:var(--blanco);border-radius:8px;padding:11px 14px;font-size:.86rem;margin-bottom:16px}
.pista b{display:block;font-family:var(--serif);font-size:.95rem;line-height:1.3}
.casillas{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.casilla{width:28px;height:36px;border:1.5px solid var(--linea);border-radius:5px;background:var(--blanco);display:grid;place-items:center;position:relative;font-weight:600}
.casilla.ok{border-color:var(--oliva);background:#EDF2EA}
.casilla.mal{border-color:var(--lacre);background:#F7EAEA}
.casilla .sg{position:absolute;top:-9px;font-size:.68rem;font-weight:700}
.casilla.ok .sg{color:var(--oliva)}
.casilla.mal .sg{color:var(--lacre)}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.teclado button{padding:11px 0;border:1px solid var(--linea);background:var(--blanco);border-radius:7px;font-size:1rem;cursor:pointer;font-family:var(--sans);color:var(--tinta)}
.teclado button:active{background:var(--crema)}
.pedir{display:none;margin-top:16px;background:none;border:0;text-decoration:underline;color:var(--lacre);font-size:.84rem;cursor:pointer;font-family:var(--sans)}
.pedir.visible{display:inline-block}
.laPista{display:none;margin-top:10px;font-size:.84rem;background:#F2EDE3;border-radius:7px;padding:10px}
.laPista.visible{display:block}
.prog{display:none;text-align:center;margin-top:26px}
.programada .prog{display:block}
.reloj{display:flex;gap:8px;justify-content:center;font-family:var(--serif);font-size:1.55rem}
.reloj span{background:var(--blanco);border:1px solid var(--linea);border-radius:8px;padding:7px 10px;min-width:52px}
.reloj small{display:block;font-family:var(--sans);font-size:.58rem;text-transform:uppercase;color:var(--gris);font-weight:400;letter-spacing:.05em}
.fp{font-size:.83rem;color:var(--gris);margin:12px 0 0;max-width:30ch}
.carta{max-width:620px;margin:0 auto;padding:36px 20px 60px;display:none}
.carta.visible{display:block}
.carta h2{font-family:var(--serif);font-size:clamp(1.7rem,5vw,2.4rem);margin:0 0 6px;line-height:1.2}
.carta .para{color:var(--gris);margin:0 0 24px;font-size:.92rem}
.mensaje{font-family:var(--serif);font-size:1.1rem;line-height:1.75;margin:0 0 26px}
.mensaje p{margin:0 0 15px}
.fotos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:26px}
.fotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px}
.bloque{border:1px solid var(--linea);border-radius:10px;background:var(--blanco);padding:14px;margin-bottom:16px;display:flex;align-items:center;gap:12px;cursor:pointer}
.bloque b{font-size:.9rem;display:block}
.bloque small{color:var(--gris);font-size:.76rem}
.bloque audio{width:100%;margin-top:6px}
.video{aspect-ratio:9/16;max-width:280px;margin:0 auto 24px}
.video iframe{width:100%;height:100%;border:0;border-radius:14px}
.cierre-final{text-align:center;font-family:var(--serif);font-size:1.26rem;margin:30px 0 8px}
.firma{text-align:center;color:var(--gris);margin:0 0 34px}
.pie{text-align:center;border-top:1px solid var(--linea);padding-top:22px}
.pie a{color:var(--lacre);font-weight:600;text-decoration:none}
.pie span{display:block;font-size:.74rem;color:var(--gris);margin-top:8px}
.dueno{position:fixed;left:0;right:0;bottom:0;background:var(--tinta);color:#fff;padding:10px 14px;display:none;gap:8px;align-items:center;font-size:.76rem;z-index:60;flex-wrap:wrap}
.dueno.visible{display:flex}
.dueno input{flex:1;min-width:110px;padding:8px;border-radius:6px;border:0;font-size:.74rem;font-family:var(--sans)}
.dueno button{border:0;border-radius:6px;padding:8px 11px;background:var(--lacre);color:#fff;font-weight:600;cursor:pointer;font-family:var(--sans)}
.dueno a{color:#EFE7DB;text-decoration:underline;white-space:nowrap}
#qrCaja{display:none;width:100%;text-align:center;padding-top:8px}
#qr{width:150px;height:150px;background:#fff;padding:6px;border-radius:6px}
/* cierres */
.f-nota .pieza{border-radius:2px}
.f-pola .pieza{background:#fff;padding:9px 9px 26px}
.f-pola .pieza::after{content:"";position:absolute;inset:9px 9px 26px;background:linear-gradient(160deg,#E9D6D6,#8E2F2F)}
.f-pola .solapa,.f-pola .sello{display:none}
.f-caja .pieza{border-radius:4px}
.f-frasco .pieza{border-radius:10px 10px 44px 44px;background:#EFEAE0}
.f-vinilo .pieza{border-radius:4px;background:#2A2621}
.f-peli .pieza{border-radius:3px;background:#2A2621}
.f-avion .pieza{clip-path:polygon(0 45%,100% 0,62% 100%,52% 58%);background:var(--blanco);border:0;box-shadow:none}
@media(prefers-reduced-motion:reduce){.solapa{transition:none}}
</style></head><body>

<section class="cierre" id="pantalla">
  <div class="texto"><p class="k">Recibiste una carta</p><h1 id="de">de alguien</h1><p id="para"></p></div>
  <div class="escena" id="escena" role="button" tabindex="0" aria-label="Abrir la carta">
    <div class="pieza"><div class="solapa"></div><div class="sello" id="sello">C</div><div class="candado">🔒</div></div>
  </div>
  <button class="abrirBtn" id="abrir">Abrir</button>

  <div class="panel">
    <div class="pista"><b id="instruccion">Escribe la fecha</b></div>
    <div class="casillas" id="casillas" aria-live="polite"></div>
    <div class="teclado" id="teclado"></div>
    <button class="pedir" id="pedir"></button>
    <div class="laPista" id="laPista"></div>
  </div>

  <div class="prog">
    <div class="reloj"><span><b id="d">00</b><small>días</small></span><span><b id="h">00</b><small>hrs</small></span><span><b id="m">00</b><small>min</small></span><span><b id="s">00</b><small>seg</small></span></div>
    <p class="fp" id="fp"></p>
  </div>
</section>

<main class="carta" id="carta">
  <p class="para" id="fecha"></p>
  <h2 id="titulo"></h2>
  <div class="mensaje" id="mensaje"></div>
  <div id="musica"></div>
  <div id="voz"></div>
  <div class="fotos" id="fotos"></div>
  <div id="video"></div>
  <p class="cierre-final" id="cierreFinal"></p>
  <p class="firma" id="firma"></p>
  <div class="pie"><a href="index.html">Haz tu propia cartita →</a><span>Hecho en Cartita</span></div>
</main>

<div class="dueno" id="dueno">
  <input id="link" readonly aria-label="Link de tu carta">
  <button id="copiar">Copiar</button>
  <a href="#" id="verQR">Ver QR</a>
  <div id="qrCaja"><img id="qr" alt="Código QR de tu carta"></div>
</div>

<script src="plantillas.js"></script>
<script>
const $=id=>document.getElementById(id);
const d=JSON.parse(localStorage.getItem('cartita_pagado')||'null');

function abrir(){
  const e=$('escena');
  if(e.classList.contains('abierto'))return;
  e.classList.add('abierto');
  setTimeout(()=>{$('pantalla').classList.add('oculto');$('carta').classList.add('visible');},700);
}

if(!d){location.href='crear.html';}
else{
  const t=PLANTILLAS.find(x=>x.id===d.diseno)||PLANTILLAS[0];
  const r=document.documentElement.style;
  r.setProperty('--crema',t.bg);r.setProperty('--tinta',t.tx);r.setProperty('--lacre',t.ac);
  document.body.style.fontFamily=t.f==='serif'?'var(--serif)':'var(--sans)';

  $('de').textContent='de '+(d.de||'alguien');
  if(d.para)$('para').textContent='Para '+d.para;
  $('sello').textContent=(d.de||'C').charAt(0);
  $('fecha').textContent=d.fecha||'';
  $('titulo').textContent=(d.mensaje||'').split('\n')[0]||'Una carta para ti';
  $('mensaje').innerHTML=(d.mensaje||'').split('\n').slice(1).map(l=>'<p>'+l+'</p>').join('');
  $('cierreFinal').textContent=d.cierre||'';
  $('firma').textContent=d.de||'';
  $('fotos').innerHTML=(d.fotos||[]).map(f=>'<img src="'+f+'" alt="">').join('');

  if(d.cierre&&d.cierre!=='sobre')$('escena').classList.add('f-'+d.cierre);

  if(d.musica){
    $('musica').innerHTML='<div class="bloque"><div><b>Nuestra canción</b><small>Toca para escuchar</small></div></div>';
    $('musica').firstChild.onclick=()=>{
      const id=(d.musica.match(/(?:v=|youtu\.be\/)([\w-]{11})/)||[])[1];
      if(id)$('musica').innerHTML='<iframe style="width:100%;aspect-ratio:16/9;border:0;border-radius:10px" src="https://www.youtube.com/embed/'+id+'" allow="autoplay" title="Canción"></iframe>';
    };
  }
  if(d.voz)$('voz').innerHTML='<div class="bloque"><div style="flex:1"><b>Nota de voz</b><small>Escúchala</small><audio controls src="'+d.voz+'"></audio></div></div>';
  if(d.video){
    const vid=(d.video.match(/(?:v=|youtu\.be\/)([\w-]{11})/)||[])[1];
    if(vid)$('video').innerHTML='<div class="video"><iframe src="https://www.youtube.com/embed/'+vid+'" title="Video"></iframe></div>';
  }

  const modo=d.modo||'abierta';
  if(modo==='clave'&&d.clave){
    $('pantalla').classList.add('clave');
    $('instruccion').textContent=d.instruccion||'Escribe la fecha';
    $('pedir').textContent='Pedirle una pista a '+(d.de||'').split(' ')[0];
    $('laPista').textContent=d.pista||'Pregúntale a quien te la mandó.';
  }
  if(modo==='programada'&&d.apertura){
    $('pantalla').classList.add('programada');
    const fin=new Date(d.apertura+'T'+(d.hora||'20:00'));
    $('fp').textContent='Esta carta se abre el '+fin.toLocaleDateString('es-CL',{day:'numeric',month:'long',year:'numeric'})+' a las '+(d.hora||'20:00')+'.';
    const tic=()=>{
      const ms=fin-Date.now(),sg=Math.max(0,Math.floor(ms/1000));
      $('d').textContent=String(Math.floor(sg/86400)).padStart(2,'0');
      $('h').textContent=String(Math.floor(sg%86400/3600)).padStart(2,'0');
      $('m').textContent=String(Math.floor(sg%3600/60)).padStart(2,'0');
      $('s').textContent=String(sg%60).padStart(2,'0');
      if(ms<=0&&!$('pantalla').classList.contains('oculto'))abrir();
    };
    tic();setInterval(tic,1000);
  }

  const slug=(d.codigo||'AMR').replace(/[^A-Z0-9]/g,'').toLowerCase();
  const url=location.origin+location.pathname+'?c='+slug;
  $('link').value=url;
  $('dueno').classList.add('visible');
  $('copiar').onclick=()=>{navigator.clipboard.writeText(url);$('copiar').textContent='Copiado';};
  $('verQR').onclick=e=>{
    e.preventDefault();
    const c=$('qrCaja');
    const abierto=c.style.display==='block';
    c.style.display=abierto?'none':'block';
    if(!abierto&&!$('qr').src)$('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(url);
  };
}

$('abrir').addEventListener('click',abrir);
$('escena').addEventListener('click',()=>{if(!$('pantalla').classList.contains('clave'))abrir();});
$('escena').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')abrir();});

/* clave */
let escrito='',errores=0;
const casillas=$('casillas'),teclado=$('teclado');
function pintar(){
  if(!d||!d.clave)return;
  casillas.innerHTML='';
  for(let i=0;i<Math.max(4,d.clave.length);i++){
    const c=document.createElement('div');c.className='casilla';
    if(escrito[i]){
      if(escrito[i]===d.clave[i]){c.classList.add('ok');c.innerHTML='<span class="sg">✓</span>•';}
      else{c.classList.add('mal');c.innerHTML='<span class="sg">✗</span>•';}
    }
    casillas.appendChild(c);
  }
}
function digitar(n){
  if(!d||!d.clave||escrito.length>=d.clave.length)return;
  escrito+=n;
  if(escrito[escrito.length-1]!==d.clave[escrito.length-1]){
    errores++;
    if(errores>=3)$('pedir').classList.add('visible');
  }
  pintar();
  if(escrito.length>=4&&d.clave.startsWith(escrito))abrir();
}
for(let n=1;n<=9;n++){const b=document.createElement('button');b.type='button';b.textContent=n;b.onclick=()=>digitar(String(n));teclado.appendChild(b);}
const bb=document.createElement('button');bb.type='button';bb.textContent='←';bb.setAttribute('aria-label','Borrar');bb.onclick=()=>{escrito=escrito.slice(0,-1);pintar();};teclado.appendChild(bb);
const b0=document.createElement('button');b0.type='button';b0.textContent='0';b0.onclick=()=>digitar('0');teclado.appendChild(b0);
$('pedir').addEventListener('click',()=>$('laPista').classList.add('visible'));
pintar();
</script>
</body></html>
